components:
  schemas:
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/StateEnum'
        ready:
          type: boolean
        email:
          type: string
          format: email
        web_servers:
          type: array
          items:
            type: string
            format: uuid
        imap_servers:
          type: array
          items:
            type: string
            format: uuid
        smtp_servers:
          type: array
          items:
            type: string
            format: uuid
        ips:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        payment_processor:
          $ref: '#/components/schemas/AccountResponsePaymentProcessorEnum'
        usage_data:
          $ref: '#/components/schemas/UsageDataResponse'
      required:
      - created_at
      - email
      - id
      - imap_servers
      - ips
      - payment_processor
      - ready
      - smtp_servers
      - state
      - usage_data
      - web_servers
    AccountResponsePaymentProcessorEnum:
      enum:
      - stripe
      - paypal
      - bitpay
      - coinpayments
      - manual
      type: string
      description: |-
        * `stripe` - stripe
        * `paypal` - paypal
        * `bitpay` - bitpay
        * `coinpayments` - coinpayments
        * `manual` - manual
    AccountUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_processor:
          $ref: '#/components/schemas/AccountUpdatePaymentProcessorEnum'
      required:
      - id
    AccountUpdatePaymentProcessorEnum:
      enum:
      - stripe
      - paypal
      - manual
      type: string
      description: |-
        * `stripe` - Stripe
        * `paypal` - Paypal
        * `manual` - Manual
    AppTypeEnum:
      enum:
      - STA
      - NPF
      - APA
      - CUS
      - SLS
      - SLP
      - SLN
      - SVN
      - DAV
      type: string
      description: |-
        * `STA` - Static Only
        * `NPF` - Nginx/PHP-FPM
        * `APA` - Apache/PHP-FPM
        * `CUS` - Proxied port
        * `SLS` - Symbolic link, Static only
        * `SLP` - Symbolic link, Apache/PHP-FPM
        * `SLN` - Symbolic link, Nginx/PHP-FPM
        * `SVN` - Subversion
        * `DAV` - WebDAV
    ApplicationCreate:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9_-]+$
          maxLength: 64
        osuser:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AppTypeEnum'
        installer_url:
          type: string
          format: uri
          nullable: true
          maxLength: 1024
        json: {}
      required:
      - name
      - osuser
      - type
    ApplicationInstalledRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    ApplicationRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/StateEnum'
        ready:
          type: boolean
        name:
          type: string
        server:
          type: string
          format: uuid
        osuser:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AppTypeEnum'
        port:
          type: integer
          default: 8000
        installer_url:
          type: string
          default: https://raw.githubusercontent.com/opalstack/installers/master/core/django/install.py
        json:
          $ref: '#/components/schemas/ApplicationResponseJson'
      required:
      - id
      - json
      - name
      - osuser
      - ready
      - server
      - state
      - type
    ApplicationResponseJson:
      type: object
      properties:
        db_name:
          type: string
        db_user:
          type: string
        db_host:
          type: string
        db_port:
          type: integer
          default: 3306
        app_name:
          type: string
        app_port:
          type: integer
          default: 8000
        app_path:
          type: string
        app_version:
          type: string
        app_command:
          type: string
        app_lang_version:
          type: string
        sym_link_path:
          type: string
          default: /home/my_osuser/path/to/dir/
        auto_site_url:
          type: boolean
        app_exec:
          type: boolean
        url_fopen:
          type: boolean
        fpm_type:
          type: string
        fpm_max_children:
          type: integer
          default: 5
        fpm_max_requests:
          type: integer
          default: 500
        fpm_start_servers:
          type: integer
          default: 5
        fpm_min_spare_servers:
          type: integer
          default: 5
        fpm_max_spare_servers:
          type: integer
          default: 5
        php_version:
          type: integer
          default: 74
        subroot:
          type: string
        external_port_access:
          type: boolean
        add_https_security_headers:
          type: boolean
      required:
      - add_https_security_headers
      - app_command
      - app_exec
      - app_lang_version
      - app_name
      - app_path
      - app_version
      - auto_site_url
      - db_host
      - db_name
      - db_user
      - external_port_access
      - fpm_type
      - subroot
      - url_fopen
    ApplicationUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AppTypeEnum'
        json: {}
      required:
      - id
    CertCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        cert:
          type: string
        intermediates:
          type: string
          nullable: true
        key:
          type: string
      required:
      - cert
      - key
    CertRead:
      type: object
      properties:
