  /api/v1/payment/coupon_verify/:
    post:
      operationId: payment_coupon_verify_create
      description: |-
        Verify a Stripe PromotionCode without leaking your promo catalog.

        Input (JSON):
          {"coupon_code": "OPAL90", "plan": "VS", "freq": "Y"}

        Output (JSON):
          {"valid": true, "eligible": true, "message": "...", "discount": {...}}

        Notes:
        - Enforces v1 business rules: yearly only + shared only.
        - Returns minimal, user-facing info so users can confirm they typed it right.
        - Does NOT expose internal lists of promo codes.
      tags:
      - payment
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
